name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Bez AAR Samsung Health Sensor SDK zegarek buduje się z zaślepką (patrz docs/faza-0.md).
      - name: Testy, build i lint
        run: ./gradlew test assembleDebug lintDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: |
            app-phone/build/outputs/apk/debug/*.apk
            app-wear/build/outputs/apk/debug/*.apk
          retention-days: 14
